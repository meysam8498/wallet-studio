[package]
name = "daftaram"
version = "2.2.0"
description = "دفتر من — اپ حسابداری شخصی با تقویم شمسی"
authors = ["میثم ایجادی <M.Ijadi@Hotmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "daftaram"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.9", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "daftaram"
path = "src/main.rs"

[profile.release]
# بهینه‌سازی حجم بستهٔ نهایی ویندوز
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
