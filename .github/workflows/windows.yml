name: Windows

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# بارگذاری بسته‌ها به Release مجوز نوشتن محتوا می‌خواهد
permissions:
  contents: write

jobs:
  build-windows:
    name: ساخت بستهٔ ویندوز
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: کش Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها
        run: bun install --frozen-lockfile

      - name: نصب آیکون‌های موردنیاز (در صورت نبود)
        # آیکون‌ها از public/logo.svg ساخته می‌شوند؛ این گام جای‌نگهدار است
        run: echo "icons ready"

      - name: ساخت بستهٔ MSI و NSIS
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: bun x tauri build

      - name: کپی به الگوی latest
        shell: bash
        run: |
          mkdir -p renamed
          cp src-tauri/target/release/bundle/nsis/*.exe renamed/Daftaram-latest-windows-x64-setup.exe
          cp src-tauri/target/release/bundle/nsis/*.exe renamed/Daftaram-2.7.0-windows-x64-setup.exe || true
          ls renamed/

      - name: بارگذاری بسته‌ها به Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            renamed/*
          append_body: true
