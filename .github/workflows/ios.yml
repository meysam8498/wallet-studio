name: iOS

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# بارگذاری بسته به Release مجوز نوشتن محتوا می‌خواهد
permissions:
  contents: write

jobs:
  build-ios:
    name: ساخت بستهٔ iOS (بدون امضا)
    # بستهٔ iOS برای نصب روی iPhone به امضای Apple (حساب توسعه‌دهنده) نیاز
    # دارد؛ این گردش‌کار بستهٔ «امضانشده» می‌سازد تا با ابزار دلخواه
    # (مثلاً AltStore، Sideloadly یا حساب شخصی در Xcode) امضا و نصب شود.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب Bun
        uses: oven-sh/setup-bun@v2

      - name: نصب وابستگی‌ها
        run: bun install --frozen-lockfile

      - name: نصب CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: ساخت خروجی وب
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: bun run build

      - name: افزودن پلتفرم iOS
        # بستهٔ @capacitor/ios باید پیش از `cap add ios` در node_modules
        # باشد وگرنه پوسته ناقص ساخته می‌شود. CocoaPods هم در Capacitor 7
        # برای پوستهٔ iOS لازم است.
        run: |
          bun add @capacitor/ios@7
          if [ ! -d ios ]; then
            bun x cap add ios
          fi
          bun x cap sync ios
        env:
          CI: ""

      - name: ساخت بستهٔ بدون امضا
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          cd build/App.xcarchive/Products/Applications
          mkdir -p ../../Payload
          cp -r App.app ../../Payload/
          cd ../..
          zip -r ../../../ios-unsigned.zip Payload
          mv Payload ios-unsigned.ipa 2>/dev/null || zip -r ../../../ios-unsigned.ipa Payload
          cd ../../../..

      - name: بارگذاری بسته به Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios-unsigned.zip
            ios-unsigned.ipa
          append_body: true
